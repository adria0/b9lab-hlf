version: '2'

networks:
  certificates:

services:
  fabricca:
    image: hyperledger/fabric-ca:x86_64-1.0.6
    container_name: fabricca
    working_dir: /etc/hyperledger/fabric-ca-server
    volumes:
      - ./fabric-ca-server:/etc/hyperledger/fabric-ca-server
      - ./scripts:/var/hyperledger/scripts
    networks:
      - certificates
    

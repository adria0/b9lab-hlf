version: '2'

networks:
  artstamper:

services:

  # orderer service --------------------------------------------------------------------------------------------
  #
  # The OS creates new blocks by ordering the transactions. It provides a shared communication channel to
  # clients and peers.
  #
  # The "solo" orderer is used (see configtx.yaml)
  #
  # ------------------------------------------------------------------------------------------------------------

  orderer.artstamper.com:
    image: hyperledger/fabric-orderer:x86_64-1.0.0
    container_name: orderer.artstamper.com
    environment:
      # host IPs service binding
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      
      # where to find the genesys block
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      
      # which Membership Service Provider to use 
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp

      # enabled TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    volumes:    
      - ./orderer/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers/orderer.artstamper.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers/orderer.artstamper.com/tls:/var/hyperledger/orderer/tls
    command: orderer
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    ports:
      - 7050:7050
    networks:
      - artstamper

  # organization 1, peers & client -----------------------------------------------------------------------------
  #
  # This organizaton has 
  #
  #   - two peers, one of them connected to a database
  #   - one client to access to the peers
  #
  # ------------------------------------------------------------------------------------------------------------

  peer0.org1.com:
    container_name: peer0.org1.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:

      # the ID of this peer
      - CORE_PEER_ID=peer0.org1.com
      
      # bind the peer to this addres:port
      - CORE_PEER_ADDRESS=peer0.org1.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.com:7051
      
      # which membership provider to use
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/

      # the database for this peer ia chouldDB 
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=db.peer0.org1.com:5984

      # enabled TLS, the CHAINCODELISTENADDRESS is requiered when using TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_CHAINCODELISTENADDRESS=peer0.org1.com:7052

    volumes:
      - ./crypto-config/peerOrganizations/org1.com/peers/peer0.org1.com/msp:/etc/hyperledger/msp/peer
      - ./crypto-config/peerOrganizations/org1.com/peers/peer0.org1.com/tls:/etc/hyperledger/fabric/tls

    ports:
      - 17051:7051
      - 17053:7053

    depends_on:
      - orderer.artstamper.com
      - db.peer0.org1.com

    networks:
      - artstamper

  db.peer0.org1.com:
    container_name: db.peer0.org1.com
    image: hyperledger/fabric-couchdb:x86_64-1.0.0
    environment:
      DB_URL: http://localhost:5984/
    ports:
      - "5984:5984"
    networks:
      - artstamper
 
  peer1.org1.com:
    container_name: peer1.org1.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer1.org1.com
      - CORE_PEER_ADDRESS=peer1.org1.com:7051
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org1.com:7051
      # enabled TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_CHAINCODELISTENADDRESS=peer1.org1.com:7052

    volumes:
      - ./crypto-config/peerOrganizations/org1.com/peers/peer1.org1.com/msp:/etc/hyperledger/msp/peer
      - ./crypto-config/peerOrganizations/org1.com/peers/peer1.org1.com/tls:/etc/hyperledger/fabric/tls

    ports:
      - 27051:7051
      - 27053:7053
    depends_on:
      - orderer.artstamper.com
    networks:
      - artstamper

  cli.org1.com:
    extends:
      file: ./cli.yaml
      service: cli
    container_name: cli.org1.com
    environment:
      # is of this client 
      - CORE_PEER_ID=cli.org1.com

      # what peer to connect, could be peer0 or peer1 
      - CORE_PEER_ADDRESS=peer0.org1.com:7051

      # what membership provider to use, in this case the administration org1 is ok
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/users/Admin@org1.com/msp
 
      # enabled TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/msp/peers/peer0.org1.com/msp/cacerts/ca.org1.com-cert.pem
      - CORE_PEER_CHAINCODELISTENADDRESS=peer0.org1.com:7052
    volumes:
      - ./crypto-config/peerOrganizations/org1.com:/etc/hyperledger/msp
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers:/etc/hyperledger/orderers
    depends_on:
      - orderer.artstamper.com
      - peer0.org1.com
      - peer1.org1.com
    networks:
      - artstamper

  # organization 1, peers & client -----------------------------------------------------------------------------
  #
  # This organizaton has 
  #
  #   - two peers
  #   - one client to access to the peers
  #
  # ------------------------------------------------------------------------------------------------------------

  peer0.org2.com:
    container_name: peer0.org2.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
        - CORE_PEER_ID=peer0.org2.comw:

      - CORE_PEER_ADDRESS=peer0.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.com:7051
      # enabled TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_CHAINCODELISTENADDRESS=peer0.org2.com:7052
      
    volumes:
      - ./crypto-config/peerOrganizations/org2.com/peers/peer0.org2.com/msp:/etc/hyperledger/msp/peer
      - ./crypto-config/peerOrganizations/org2.com/peers/peer0.org2.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - 37051:7051
      - 37053:7053
    depends_on:
      - orderer.artstamper.com
    networks:
      - artstamper

  peer1.org2.com:
    container_name: peer1.org2.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer1.org2.com
      - CORE_PEER_ADDRESS=peer1.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org2.com:7051
      # enabled TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_CHAINCODELISTENADDRESS=peer1.org2.com:7052
      
    volumes:
      - ./crypto-config/peerOrganizations/org2.com/peers/peer1.org2.com/msp:/etc/hyperledger/msp/peer
      - ./crypto-config/peerOrganizations/org2.com/peers/peer1.org2.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - 47051:7051
      - 47053:7053
    depends_on:
      - orderer.artstamper.com
    networks:
      - artstamper

  cli.org2.com:
    extends:
      file: ./cli.yaml
      service: cli
    container_name: cli.org2.com
    environment:
      - CORE_PEER_ID=cli.org2.com
      - CORE_PEER_ADDRESS=peer0.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/users/Admin@org2.com/msp
      # enabled TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/msp/peers/peer0.org2.com/msp/cacerts/ca.org2.com-cert.pem
    volumes:
      - ./crypto-config/peerOrganizations/org2.com:/etc/hyperledger/msp
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers:/etc/hyperledger/orderers
    depends_on:
      - orderer.artstamper.com
      - peer0.org2.com
      - peer1.org2.com
    networks:
      - artstamper


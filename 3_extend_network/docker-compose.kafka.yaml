version: '2'

networks:
  artstamper:

services:

  # orderer service /  zookeeper -------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------
  zookeeper0:
    container_name: zookeeper0
    extends:
      file: kafka.yaml
      service: zookeeper
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=zookeeper0:2888:3888 server.2=zookeeper1:2888:3888 server.3=zookeeper2:2888:3888
    networks:
      - artstamper

  zookeeper1:
    container_name: zookeeper1
    extends:
      file: kafka.yaml
      service: zookeeper
    environment:
      - ZOO_MY_ID=2
      - ZOO_SERVERS=server.1=zookeeper0:2888:3888 server.2=zookeeper1:2888:3888 server.3=zookeeper2:2888:3888
    networks:
      - artstamper

  zookeeper2:
    container_name: zookeeper2
    extends:
      file: kafka.yaml
      service: zookeeper
    environment:
      - ZOO_MY_ID=3
      - ZOO_SERVERS=server.1=zookeeper0:2888:3888 server.2=zookeeper1:2888:3888 server.3=zookeeper2:2888:3888
    networks:
      - artstamper

  # orderer service /  kafka -----------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------

  kafka0:
    container_name: kafka0
    extends:
      file: kafka.yaml
      service: kafka
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper0:2181,zookeeper1:2181,zookeeper2:2181
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
    ports:
      - 9092:9092
    networks:
      - artstamper

  kafka1:
    container_name: kafka1
    extends:
      file: kafka.yaml
      service: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper0:2181,zookeeper1:2181,zookeeper2:2181
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
    ports:
      - 10092:9092
    networks:
      - artstamper

  kafka2:
    container_name: kafka2
    extends:
      file: kafka.yaml
      service: kafka
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper0:2181,zookeeper1:2181,zookeeper2:2181
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
    ports:
      - 11092:9092
    networks:
      - artstamper

  kafka3:
    container_name: kafka3
    extends:
      file: kafka.yaml
      service: kafka
    environment:
      - KAFKA_BROKER_ID=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper0:2181,zookeeper1:2181,zookeeper2:2181
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
    ports:
      - 12092:9092
    networks:
      - artstamper

  # orderer service /  orderers -----------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------

  orderer0.artstamper.com:
    container_name: orderer0.artstamper.com
    extends:
      file: orderer.yaml
      service: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers/orderer0.artstamper.com/msp:/var/hyperledger/orderer/msp
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
      - kafka0
      - kafka1
      - kafka2
      - kafka3
    networks:
      - artstamper

  orderer1.artstamper.com:
    container_name: orderer1.artstamper.com
    extends:
      file: orderer.yaml
      service: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers/orderer1.artstamper.com/msp:/var/hyperledger/orderer/msp
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
      - kafka0
      - kafka1
      - kafka2
      - kafka3
    networks:
      - artstamper

  orderer2.artstamper.com:
    container_name: orderer2.artstamper.com
    extends:
      file: orderer.yaml
      service: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/artstamper.com/orderers/orderer2.artstamper.com/msp:/var/hyperledger/orderer/msp
    depends_on:
      - zookeeper0
      - zookeeper1
      - zookeeper2
      - kafka0
      - kafka1
      - kafka2
      - kafka3
    networks:
      - artstamper

  # organization 1, peers & client -----------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------

  peer0.org1.com:
    container_name: peer0.org1.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer0.org1.com
      - CORE_PEER_ADDRESS=peer0.org1.com:7051
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.com:17051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=db.peer0.org1.com:5984
    volumes:
      - ./crypto-config/peerOrganizations/org1.com/peers/peer0.org1.com/msp:/etc/hyperledger/msp/peer

    ports:
      - 17051:7051
      - 17053:7053

    depends_on:
      - orderer0.artstamper.com
      - db.peer0.org1.com

    networks:
      - artstamper

  db.peer0.org1.com:
    container_name: db.peer0.org1.com
    image: hyperledger/fabric-couchdb:x86_64-1.0.0
    environment:
      DB_URL: http://localhost:5984/
    ports:
      - "5984:5984"
    networks:
      - artstamper
 
  peer1.org1.com:
    container_name: peer1.org1.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer1.org1.com
      - CORE_PEER_ADDRESS=peer1.org1.com:7051
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org1.com:7051

    volumes:
      - ./crypto-config/peerOrganizations/org1.com/peers/peer1.org1.com/msp:/etc/hyperledger/msp/peer

    ports:
      - 27051:7051
      - 27053:7053
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper

  cli.org1.com:
    extends:
      file: ./cli.yaml
      service: cli
    container_name: cli.org1.com
    environment:
      - CORE_PEER_ID=cli.org1.com
      - CORE_PEER_ADDRESS=peer0.org1.com:7051
      - CORE_PEER_LOCALMSPID=Org1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/users/Admin@org1.com/msp
    volumes:
      - ./crypto-config/peerOrganizations/org1.com:/etc/hyperledger/msp
    depends_on:
      - orderer0.artstamper.com
      - peer0.org1.com
      - peer1.org1.com
    networks:
      - artstamper

  # organization 2, peers & client -----------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------

  peer0.org2.com:
    container_name: peer0.org2.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer0.org2.com
      - CORE_PEER_ADDRESS=peer0.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.com:7051
      
    volumes:
      - ./crypto-config/peerOrganizations/org2.com/peers/peer0.org2.com/msp:/etc/hyperledger/msp/peer
    ports:
      - 37051:7051
      - 37053:7053
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper

  peer1.org2.com:
    container_name: peer1.org2.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer1.org2.com
      - CORE_PEER_ADDRESS=peer1.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org2.com:7051
      
    volumes:
      - ./crypto-config/peerOrganizations/org2.com/peers/peer1.org2.com/msp:/etc/hyperledger/msp/peer
    ports:
      - 47051:7051
      - 47053:7053
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper

  cli.org2.com:
    extends:
      file: ./cli.yaml
      service: cli
    container_name: cli.org2.com
    environment:
      - CORE_PEER_ID=cli.org2.com
      - CORE_PEER_ADDRESS=peer0.org2.com:7051
      - CORE_PEER_LOCALMSPID=Org2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/users/Admin@org2.com/msp
    volumes:
      - ./crypto-config/peerOrganizations/org2.com:/etc/hyperledger/msp
    depends_on:
      - orderer0.artstamper.com
      - peer0.org2.com
      - peer1.org2.com
    networks:
      - artstamper

  # organization 3, peers & client -----------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------------------

  peer0.org3.com:
    container_name: peer0.org3.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer0.org3.com
      - CORE_PEER_ADDRESS=peer0.org3.com:7051
      - CORE_PEER_LOCALMSPID=Org3
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.com:7051
      
    volumes:
      - ./crypto-config/peerOrganizations/org3.com/peers/peer0.org3.com/msp:/etc/hyperledger/msp/peer
    ports:
      - 57051:7051
      - 57053:7053
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper

  peer1.org3.com:
    container_name: peer1.org3.com
    extends:
      file: ./peer.yaml
      service: peer
    environment:
      - CORE_PEER_ID=peer1.org3.com
      - CORE_PEER_ADDRESS=peer1.org3.com:7051
      - CORE_PEER_LOCALMSPID=Org3
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org3.com:7051
      
    volumes:
      - ./crypto-config/peerOrganizations/org3.com/peers/peer1.org3.com/msp:/etc/hyperledger/msp/peer
    ports:
      - 58051:7051
      - 58053:7053
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper

  cli.org3.com:
    extends:
      file: ./cli.yaml
      service: cli
    container_name: cli.org3.com
    environment:
      - CORE_PEER_ID=cli.org3.com
      - CORE_PEER_ADDRESS=peer0.org3.com:7051
      - CORE_PEER_LOCALMSPID=Org3
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/users/Admin@org3.com/msp
    volumes:
      - ./crypto-config/peerOrganizations/org3.com:/etc/hyperledger/msp
    depends_on:
      - orderer0.artstamper.com
    networks:
      - artstamper


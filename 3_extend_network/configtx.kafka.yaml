Organizations:
    - &OrdererOrg
        Name: OrdererMSP
        ID: OrdererMSP
        MSPDir: crypto-config/ordererOrganizations/artstamper.com/msp

    - &Org1
        Name: Org1
        ID: Org1
        MSPDir: crypto-config/peerOrganizations/org1.com/msp
        AnchorPeers:
            - Host: peer0.org1.com
              Port: 7051

    - &Org2
        Name: Org2
        ID: Org2
        MSPDir: crypto-config/peerOrganizations/org2.com/msp
        AnchorPeers:
            - Host: peer0.org2.com
              Port: 7051

    - &Org3
        Name: Org3
        ID: Org3
        MSPDir: crypto-config/peerOrganizations/org3.com/msp
        AnchorPeers:
            - Host: peer0.org3.com
              Port: 7051

Profiles:
    #  This blockchain is sometimes called a "system channel for the ordering service".
    ARTSTAMPEROrdererGenesis:
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
        Consortiums:
            ARTSTAMPER:
                Organizations:
                    - *Org1
                    - *Org2
                    - *Org3

    testchannel:
        Consortium: ARTSTAMPER
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
                - *Org2
                - *Org3

Orderer: &OrdererDefaults
    OrdererType: kafka

    Addresses:
        - orderer0.artstamper.com:7050
        - orderer1.artstamper.com:7050
        - orderer2.artstamper.com:7050

    BatchTimeout: 2s

    BatchSize:

        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB


    Kafka:
        Brokers:
            - kafka0:9092
            - kafka1:9092
            - kafka2:9092
            - kafka3:9092

    Organizations:

Application: &ApplicationDefaults
    Organizations:

        